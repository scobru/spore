  <ellipse cx="32" cy="35" rx="20" ry="6" fill="#064e3b" />
  <!-- Mushroom Cap -->
  <path d="M10 35 C10 18, 20 10, 32 10 C44 10, 54 18, 54 35 C44 38, 20 38, 10 35 Z" fill="url(#cap-grad)" stroke="#34d399" stroke-width="1.5" />
  <!-- Bioluminescent Spore Dots -->
  <circle cx="22" cy="22" r="3" fill="#6ee7b7" />
  <circle cx="33" cy="18" r="3.5" fill="#a7f3d0" />
  <circle cx="43" cy="24" r="2.5" fill="#6ee7b7" />
  <circle cx="30" cy="28" r="2" fill="#34d399" />
  <circle cx="17" cy="30" r="1.5" fill="#6ee7b7" />
  <circle cx="46" cy="31" r="1.5" fill="#6ee7b7" />
  <!-- Radio Waves -->
  <path d="M8 20 A 28 28 0 0 1 14 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M56 20 A 28 28 0 0 0 50 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>